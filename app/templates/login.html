<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | HYDRO</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="page-login">
  <main class="login-card">
    <div class="login-header">
      <div class="brand-mark">H</div>
      <h1>Sign in to HYDRO</h1>
      <p>Local access is required before regulatory data can be viewed.</p>
    </div>
    {% if error %}
    <div class="form-alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="form-field">
        <span>Username</span>
        <input name="username" autocomplete="username" required>
      </label>
      <label class="form-field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="primary-button primary-button--full">Sign in</button>
    </form>
  </main>
</body>
</html>
