name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          HYDRO_DATABASE_PATH: tests/.tmp_hydro_test.db
          HYDRO_SESSION_SECRET: test-session-secret-with-enough-entropy
          HYDRO_BOOTSTRAP_ADMIN_PASSWORD: test-admin-password
          HYDRO_SESSION_COOKIE_SECURE: "0"
        run: python -m pytest
